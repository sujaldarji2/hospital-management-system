<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors · MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-hospital-alt"></i> MediCare</h3>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a class="nav-link" href="../index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="../patient-module/index.html"><i class="fas fa-user-injured"></i> Patients</a></li>
            <li class="nav-item"><a class="nav-link active" href="index.html"><i class="fas fa-user-md"></i> Doctors</a></li>
            <li class="nav-item"><a class="nav-link" href="../appointment-module/index.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

        <div class="page-header">
            <h1><i class="fas fa-user-md me-2" style="color: var(--primary-blue);"></i>Doctors</h1>
            <a href="add.html" class="btn btn-primary"><i class="fas fa-plus me-2"></i>Add Doctor</a>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <div class="card-header">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="doctorSearch" placeholder="Search by name or specialization...">
                </div>
                <span class="text-muted small"><i class="fas fa-filter me-1"></i> Live filter</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th><th>Name</th><th>Specialization</th>
                                <th>Phone</th><th>Email</th><th>Availability</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="doctorsTableBody"></tbody>
                    </table>
                </div>
                <div id="emptyState" class="empty-state" style="display:none;">
                    <i class="fas fa-user-md"></i>
                    <p class="mb-1">No doctors found.</p>
                    <a href="add.html" class="btn btn-sm btn-primary mt-2">Add First Doctor</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script>
        let searchTerm = '';

        document.getElementById('doctorSearch').addEventListener('input', e => {
            searchTerm = e.target.value.toLowerCase();
            render();
        });

        function render() {
            const tbody = document.getElementById('doctorsTableBody');
            const empty = document.getElementById('emptyState');
            tbody.innerHTML = '';

            const filtered = getDoctors().filter(d =>
                d.name.toLowerCase().includes(searchTerm) ||
                d.specialization.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            filtered.forEach(d => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escapeHtml(d.id)}</strong></td>
                    <td>${escapeHtml(d.name)}</td>
                    <td>${escapeHtml(d.specialization)}</td>
                    <td>${escapeHtml(d.phone)}</td>
                    <td>${escapeHtml(d.email || '—')}</td>
                    <td>${escapeHtml(d.availability || '—')}</td>
                    <td>
                        <a href="details.html?id=${encodeURIComponent(d.id)}" class="btn btn-sm btn-outline-primary me-1" title="View / Edit">
                            <i class="fas fa-eye"></i>
                        </a>
                        <button class="btn btn-sm btn-outline-danger" onclick="removeDoctor('${d.id}')" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function removeDoctor(id) {
            if (!confirm('Delete this doctor? Related appointments will also be removed.')) return;
            deleteDoctor(id);
            showAlert('alertContainer', 'Doctor deleted successfully.', 'success');
            render();
        }

        render();
    </script>
</body>
</html>
