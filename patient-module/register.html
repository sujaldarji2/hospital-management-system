<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Patient · MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-hospital-alt"></i> MediCare</h3>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a class="nav-link" href="../index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="index.html"><i class="fas fa-user-injured"></i> Patients</a></li>
            <li class="nav-item"><a class="nav-link" href="../doctor-module/index.html"><i class="fas fa-user-md"></i> Doctors</a></li>
            <li class="nav-item"><a class="nav-link" href="../appointment-module/index.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

        <div class="page-header">
            <h1><i class="fas fa-user-plus me-2" style="color: var(--primary-blue);"></i>Register Patient</h1>
            <a href="index.html" class="btn btn-outline-primary"><i class="fas fa-arrow-left me-2"></i>Back to List</a>
        </div>

        <div id="alertContainer"></div>

        <div class="card" style="max-width: 820px;">
            <div class="card-body p-4">
                <form id="patientForm" novalidate>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" required minlength="2">
                            <div class="invalid-feedback">Please enter the patient's full name.</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Age <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="age" min="0" max="150" required>
                            <div class="invalid-feedback">Enter a valid age.</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Gender <span class="text-danger">*</span></label>
                            <select class="form-select" id="gender" required>
                                <option value="">Select gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                            <div class="invalid-feedback">Please select a gender.</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Phone <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="phone" required pattern="[0-9+\-\s()]{7,20}">
                            <div class="invalid-feedback">Enter a valid phone number (7–20 digits).</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                            <div class="invalid-feedback">Enter a valid email address.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" id="address">
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save Patient</button>
                        <a href="index.html" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script>
        const form = document.getElementById('patientForm');

        form.addEventListener('submit', e => {
            e.preventDefault();
            e.stopPropagation();

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const patient = {
                name: document.getElementById('name').value.trim(),
                age: parseInt(document.getElementById('age').value, 10),
                gender: document.getElementById('gender').value,
                phone: document.getElementById('phone').value.trim(),
                email: document.getElementById('email').value.trim(),
                address: document.getElementById('address').value.trim()
            };

            const saved = addPatient(patient);
            showAlert('alertContainer', `Patient ${saved.name} registered (ID: ${saved.id}). Redirecting...`, 'success');

            form.classList.remove('was-validated');
            form.reset();

            setTimeout(() => window.location.href = 'index.html', 1200);
        });
    </script>
</body>
</html>
