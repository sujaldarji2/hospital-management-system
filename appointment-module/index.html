<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments · MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-hospital-alt"></i> MediCare</h3>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a class="nav-link" href="../index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="../patient-module/index.html"><i class="fas fa-user-injured"></i> Patients</a></li>
            <li class="nav-item"><a class="nav-link" href="../doctor-module/index.html"><i class="fas fa-user-md"></i> Doctors</a></li>
            <li class="nav-item"><a class="nav-link active" href="index.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

        <div class="page-header">
            <h1><i class="fas fa-calendar-check me-2" style="color: var(--primary-blue);"></i>Appointments</h1>
            <a href="book.html" class="btn btn-primary"><i class="fas fa-plus me-2"></i>Book Appointment</a>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <div class="card-header">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="apptSearch" placeholder="Search by patient, doctor or status...">
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <select class="form-select form-select-sm" id="statusFilter" style="max-width: 160px;">
                        <option value="">All Status</option>
                        <option>Scheduled</option>
                        <option>Completed</option>
                        <option>Cancelled</option>
                    </select>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th>
                                <th>Time</th><th>Reason</th><th>Status</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="apptTableBody"></tbody>
                    </table>
                </div>
                <div id="emptyState" class="empty-state" style="display:none;">
                    <i class="fas fa-calendar-times"></i>
                    <p class="mb-1">No appointments found.</p>
                    <a href="book.html" class="btn btn-sm btn-primary mt-2">Book First Appointment</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script>
        let searchTerm = '';
        let statusFilter = '';

        document.getElementById('apptSearch').addEventListener('input', e => {
            searchTerm = e.target.value.toLowerCase();
            render();
        });
        document.getElementById('statusFilter').addEventListener('change', e => {
            statusFilter = e.target.value;
            render();
        });

        function render() {
            const tbody = document.getElementById('apptTableBody');
            const empty = document.getElementById('emptyState');
            tbody.innerHTML = '';

            const filtered = getAppointments().filter(a => {
                const patient = getPatientById(a.patientId);
                const doctor = getDoctorById(a.doctorId);
                const haystack = `${a.id} ${patient?.name || ''} ${doctor?.name || ''} ${a.status}`.toLowerCase();
                const matchesSearch = haystack.includes(searchTerm);
                const matchesStatus = !statusFilter || a.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            if (filtered.length === 0) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            filtered.forEach(a => {
                const patient = getPatientById(a.patientId);
                const doctor = getDoctorById(a.doctorId);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escapeHtml(a.id)}</strong></td>
                    <td>${escapeHtml(patient ? patient.name : 'N/A')}</td>
                    <td>${escapeHtml(doctor ? doctor.name : 'N/A')}</td>
                    <td>${formatDate(a.date)}</td>
                    <td>${formatTime(a.time)}</td>
                    <td>${escapeHtml(a.reason || '—')}</td>
                    <td><span class="badge-status badge-${a.status.toLowerCase()}">${a.status}</span></td>
                    <td>
                        <a href="details.html?id=${encodeURIComponent(a.id)}" class="btn btn-sm btn-outline-primary me-1" title="View / Edit">
                            <i class="fas fa-eye"></i>
                        </a>
                        ${a.status !== 'Cancelled' ? `
                            <button class="btn btn-sm btn-outline-danger" onclick="cancelAppt('${a.id}')" title="Cancel">
                                <i class="fas fa-times"></i>
                            </button>` : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function cancelAppt(id) {
            if (!confirm('Cancel this appointment?')) return;
            cancelAppointment(id);
            showAlert('alertContainer', 'Appointment cancelled.', 'success');
            render();
        }

        render();
    </script>
</body>
</html>
