<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Details · MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-hospital-alt"></i> MediCare</h3>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a class="nav-link" href="../index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="../patient-module/index.html"><i class="fas fa-user-injured"></i> Patients</a></li>
            <li class="nav-item"><a class="nav-link" href="../doctor-module/index.html"><i class="fas fa-user-md"></i> Doctors</a></li>
            <li class="nav-item"><a class="nav-link active" href="index.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

        <div class="page-header">
            <h1><i class="fas fa-calendar-alt me-2" style="color: var(--primary-blue);"></i>Appointment Details</h1>
            <a href="index.html" class="btn btn-outline-primary"><i class="fas fa-arrow-left me-2"></i>Back to List</a>
        </div>

        <div id="alertContainer"></div>
        <div id="notFound" class="card p-5 text-center" style="display:none;">
            <i class="fas fa-calendar-times fa-3x text-muted mb-3"></i>
            <h5>Appointment not found</h5>
            <a href="index.html" class="btn btn-primary mt-3">Back to Appointments</a>
        </div>

        <div class="card" id="detailsCard" style="display:none; max-width: 860px;">
            <div class="card-header">
                <span><i class="fas fa-calendar-check me-2" style="color: var(--primary-blue);"></i>Appointment <span id="headerId"></span></span>
                <span class="badge-status" id="statusBadge"></span>
            </div>
            <div class="card-body p-4">
                <form id="apptForm" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Patient <span class="text-danger">*</span></label>
                            <select class="form-select" id="patientId" required></select>
                            <div class="invalid-feedback">Please select a patient.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Doctor <span class="text-danger">*</span></label>
                            <select class="form-select" id="doctorId" required></select>
                            <div class="invalid-feedback">Please select a doctor.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Time <span class="text-danger">*</span></label>
                            <input type="time" class="form-control" id="time" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Reason</label>
                            <textarea class="form-control" id="reason" rows="3"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="status">
                                <option>Scheduled</option>
                                <option>Completed</option>
                                <option>Cancelled</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Update Appointment</button>
                        <button type="button" class="btn btn-outline-danger" onclick="cancelCurrent()" id="cancelBtn">
                            <i class="fas fa-times me-2"></i>Cancel Appointment
                        </button>
                        <a href="index.html" class="btn btn-outline-secondary ms-auto">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        let current = id ? getAppointmentById(id) : null;

        function populateSelects(selectedPatient, selectedDoctor) {
            const patients = getPatients();
            const doctors = getDoctors();
            document.getElementById('patientId').innerHTML = '<option value="">Select patient</option>' +
                patients.map(p => `<option value="${p.id}" ${p.id === selectedPatient ? 'selected' : ''}>${escapeHtml(p.name)} (${p.id})</option>`).join('');
            document.getElementById('doctorId').innerHTML = '<option value="">Select doctor</option>' +
                doctors.map(d => `<option value="${d.id}" ${d.id === selectedDoctor ? 'selected' : ''}>${escapeHtml(d.name)} — ${escapeHtml(d.specialization)}</option>`).join('');
        }

        function updateStatusBadge(status) {
            const badge = document.getElementById('statusBadge');
            badge.className = `badge-status badge-${status.toLowerCase()}`;
            badge.innerText = status;
        }

        if (!current) {
            document.getElementById('notFound').style.display = 'block';
        } else {
            document.getElementById('detailsCard').style.display = 'block';
            document.getElementById('headerId').innerText = current.id;
            updateStatusBadge(current.status);
            populateSelects(current.patientId, current.doctorId);
            document.getElementById('date').value = current.date;
            document.getElementById('time').value = current.time;
            document.getElementById('reason').value = current.reason || '';
            document.getElementById('status').value = current.status;

            if (current.status === 'Cancelled') {
                document.getElementById('cancelBtn').style.display = 'none';
            }
        }

        document.getElementById('status').addEventListener('change', e => updateStatusBadge(e.target.value));

        document.getElementById('apptForm').addEventListener('submit', e => {
            e.preventDefault();
            const form = e.target;
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }
            const newStatus = document.getElementById('status').value;
            updateAppointment(id, {
                patientId: document.getElementById('patientId').value,
                doctorId: document.getElementById('doctorId').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                reason: document.getElementById('reason').value.trim(),
                status: newStatus
            });
            updateStatusBadge(newStatus);
            if (newStatus === 'Cancelled') {
                document.getElementById('cancelBtn').style.display = 'none';
            }
            showAlert('alertContainer', 'Appointment updated successfully.', 'success');
            form.classList.remove('was-validated');
        });

        function cancelCurrent() {
            if (!confirm('Cancel this appointment?')) return;
            cancelAppointment(id);
            updateStatusBadge('Cancelled');
            document.getElementById('status').value = 'Cancelled';
            document.getElementById('cancelBtn').style.display = 'none';
            showAlert('alertContainer', 'Appointment cancelled.', 'success');
        }
    </script>
</body>
</html>
