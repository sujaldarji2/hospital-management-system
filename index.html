<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare · Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- ========== SIDEBAR ========== -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-hospital-alt"></i> MediCare</h3>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a class="nav-link active" href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="patient-module/index.html"><i class="fas fa-user-injured"></i> Patients</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="doctor-module/index.html"><i class="fas fa-user-md"></i> Doctors</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="appointment-module/index.html"><i class="fas fa-calendar-check"></i> Appointments</a>
            </li>
        </ul>
    </nav>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="main-content">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

        <div class="page-header">
            <h1><i class="fas fa-chart-pie me-2" style="color: var(--primary-blue);"></i>Dashboard</h1>
            <span class="text-muted"><i class="far fa-calendar-alt me-1"></i> <span id="todayDate"></span></span>
        </div>

        <!-- Stats Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-6 col-xl-3">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="icon-circle"><i class="fas fa-user-injured"></i></div>
                    <div>
                        <h6>Total Patients</h6>
                        <h3 id="totalPatients">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="icon-circle"><i class="fas fa-user-md"></i></div>
                    <div>
                        <h6>Total Doctors</h6>
                        <h3 id="totalDoctors">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="icon-circle"><i class="fas fa-calendar-day"></i></div>
                    <div>
                        <h6>Today's Appointments</h6>
                        <h3 id="todayAppointments">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="icon-circle"><i class="fas fa-check-circle"></i></div>
                    <div>
                        <h6>Completed Appointments</h6>
                        <h3 id="completedAppointments">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart + Recent -->
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card h-100">
                    <div class="card-header">
                        <span><i class="fas fa-chart-bar me-2" style="color: var(--primary-blue);"></i>Appointments by Doctor</span>
                    </div>
                    <div class="card-body">
                        <div class="bar-chart" id="doctorChart"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card h-100">
                    <div class="card-header">
                        <span><i class="fas fa-clock me-2" style="color: var(--primary-blue);"></i>Recent Appointments</span>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="recentAppointmentsList"></ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick links -->
        <div class="row g-4 mt-3">
            <div class="col-md-4">
                <a href="patient-module/register.html" class="card quick-link text-decoration-none">
                    <div class="card-body text-center py-4">
                        <i class="fas fa-user-plus fa-2x mb-2" style="color: var(--primary-blue);"></i>
                        <h6 class="mb-0">Register New Patient</h6>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="doctor-module/add.html" class="card quick-link text-decoration-none">
                    <div class="card-body text-center py-4">
                        <i class="fas fa-user-md fa-2x mb-2" style="color: var(--primary-blue);"></i>
                        <h6 class="mb-0">Add New Doctor</h6>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="appointment-module/book.html" class="card quick-link text-decoration-none">
                    <div class="card-body text-center py-4">
                        <i class="fas fa-calendar-plus fa-2x mb-2" style="color: var(--primary-blue);"></i>
                        <h6 class="mb-0">Book Appointment</h6>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
